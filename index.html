<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Expense Tracker</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head>
<body><div class="app"><header><div><h1>Expense Tracker</h1><p>Track income, expenses and spending patterns.</p></div><button id="clearAllBtn" class="danger">Clear All</button></header>
<section class="summary"><div><span>Balance</span><h2 id="balance">₹0.00</h2></div><div><span>Income</span><h2 id="income">₹0.00</h2></div><div><span>Expense</span><h2 id="expense">₹0.00</h2></div><div><span>Transactions</span><h2 id="count">0</h2></div></section>
<section class="grid"><article class="panel"><h2>Add Transaction</h2><form id="form"><label>Title<input id="title" required placeholder="Grocery shopping"></label><div class="row"><label>Amount<input id="amount" type="number" min="0.01" step="0.01" required></label><label>Type<select id="type"><option value="expense">Expense</option><option value="income">Income</option></select></label></div><div class="row"><label>Category<select id="category"><option>Food</option><option>Travel</option><option>Shopping</option><option>Education</option><option>Bills</option><option>Entertainment</option><option>Health</option><option>Salary</option><option>Other</option></select></label><label>Date<input id="date" type="date" required></label></div><button class="primary" type="submit">Add Transaction</button></form></article>
<article class="panel"><div class="panel-head"><h2>Transactions</h2><div class="filters"><input id="search" placeholder="Search..."><select id="filterType"><option value="all">All</option><option value="income">Income</option><option value="expense">Expense</option></select><select id="filterCategory"><option value="all">All categories</option><option>Food</option><option>Travel</option><option>Shopping</option><option>Education</option><option>Bills</option><option>Entertainment</option><option>Health</option><option>Salary</option><option>Other</option></select></div></div><div id="list"></div></article></section>
<section class="charts"><article class="panel"><h2>Expenses by Category</h2><div class="chartbox"><canvas id="categoryChart"></canvas></div></article><article class="panel"><h2>Income vs Expense</h2><div class="chartbox"><canvas id="monthlyChart"></canvas></div></article></section></div><script src="charts.js"></script><script src="script.js"></script></body></html>
